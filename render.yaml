services:
  - type: web
    name: sgc-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sgc-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
        value: "https://sgc-frontend.onrender.com,http://localhost:3000"
      - key: ENVIRONMENT
        value: "production"
    disk:
      name: sgc-disk
      mountPath: /app/data
      sizeGB: 1

  - type: web
    name: sgc-frontend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXTAUTH_URL
        value: "https://sgc-frontend.onrender.com"
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_API_URL
        value: "https://sgc-backend.onrender.com/api/v1"
      - key: NEXT_PUBLIC_APP_NAME
        value: "SGC-Trazabilidad"

  - type: pgsql
    name: sgc-postgres
    plan: free
    database: sgc_trazabilidad
    user: sgc_user
